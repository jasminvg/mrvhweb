  .about-photo-wrap { position: relative; min-height: 320px; }
  .about-photo-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; border-radius: var(--radius); }
  @media (max-width: 860px) {
    .about-values { grid-template-columns: 1fr; }
